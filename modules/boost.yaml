name: boost
buildsystem: simple
sources:
  - type: archive
    url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
    sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
    x-checker-data:
      type: anitya
      project-id: 6845
      stable-only: true
      url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_${patch}.tar.bz2
      versions:
        '!=': 1.91.0-1
build-commands:
  - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=iostreams,regex,filesystem,locale
  - ./b2 headers
  - ./b2 -j$FLATPAK_BUILDER_N_JOBS install variant=release cxxstd=17 --layout=system
