name: Check for updates
on:
  schedule: # for scheduling to work this file must be in the default branch
    - cron: "13 * * * *"
  workflow_dispatch: # can be manually dispatched under GitHub's "Actions" tab

jobs:
  flatpak-external-data-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    container:
      image: archlinux:latest
      options: --init --privileged
    strategy:
      fail-fast: false

    steps:
      - name: Fix Git dubious ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Setup
        run: |
          pacman -Syu --needed --noconfirm flatpak git
          flatpak install -y --system --from https://dl.flathub.org/repo/appstream/org.flathub.flatpak-external-data-checker.flatpakref

      - uses: actions/checkout@v3
        with:
          ref: ${{ matrix.branch }}

      - name: Update
        id: update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in org.fcitx.Fcitx5*.yaml; do
            flatpak run --filesystem=$PWD org.flathub.flatpak-external-data-checker --update --commit-only --commit-to-current-branch $f
          done
          git log -p ${{ github.sha }}..HEAD || true
          {
            echo "details<<EOF"
            git log --reverse --format="%B" ${{ github.sha }}..HEAD
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull request
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            *.yaml
          commit-message: |
            Update dependencies

            ${{ steps.update.outputs.details }}
          branch: external-deps
          delete-branch: true
          title: 'Update dependencies'
          body: |
            ${{ steps.update.outputs.details }}

