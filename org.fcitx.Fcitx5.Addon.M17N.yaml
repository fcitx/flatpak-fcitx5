app-id: org.fcitx.Fcitx5.Addon.M17N
branch: master
runtime: org.fcitx.Fcitx5
runtime-version: master
sdk: org.kde.Sdk//6.11
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/M17N
  prepend-pkg-config-path: /app/addons/M17N/lib/pkgconfig:/app/addons/M17N/share/pkgconfig
  no-debuginfo: true
  strip: true
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - '*.la'
modules:
  - name: m17n-lib
    no-parallel-make: true
    sources:
      - type: archive
        url: https://download.savannah.gnu.org/releases/m17n/m17n-lib-1.8.7.tar.gz
        sha256: a72cf78e40198020aa05217b9839dd260b94d4f2dc59a5a8d60bae7b84104caa
        x-checker-data:
          type: anitya
          project-id: 1870
          stable-only: true
          url-template: https://download.savannah.gnu.org/releases/m17n/m17n-lib-${version}.tar.gz
      - type: shell
        commands:
          - sed -i "s/freetype-config/pkg-config freetype2/" configure
  - name: m17n-db
    sources:
      - type: archive
        url: https://download-mirror.savannah.gnu.org/releases/m17n/m17n-db-1.8.16.tar.gz
        sha256: 1215c347fbc2a8318ebfcc37eacd60577f14da0f4ffaef983a062fab261f3bea
        x-checker-data:
          type: anitya
          project-id: 1869
          stable-only: true
          url-template: https://download-mirror.savannah.gnu.org/releases/m17n/m17n-db-${version}.tar.gz
  - name: fcitx5-m17n
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-m17n
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
